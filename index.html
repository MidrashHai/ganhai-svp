    background-position: center 30%;
    z-index: 0;
    animation: forestBreathe 18s ease-in-out infinite alternate;
    transform-origin: center center;
  }
  @keyframes forestBreathe {
    0%   { transform: scale(1.00) translateX(0px) translateY(0px); filter: brightness(.82) saturate(1.0); }
    33%  { transform: scale(1.02) translateX(-6px) translateY(-3px); filter: brightness(.88) saturate(1.1); }
    66%  { transform: scale(1.03) translateX(4px) translateY(-5px); filter: brightness(.85) saturate(1.05); }
    100% { transform: scale(1.01) translateX(-3px) translateY(2px); filter: brightness(.90) saturate(1.12); }
  }
  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(3,8,3,.70) 0%, rgba(5,12,5,.42) 40%, rgba(3,8,3,.72) 100%);
  }
  .ray { position:fixed; top:0; width:2px; height:70%; z-index:1; pointer-events:none; transform-origin:top center; border-radius:50%; }
  .ray-1 { left:38%; background:linear-gradient(to bottom, transparent, rgba(255,220,100,.07), transparent); animation:rayFloat 12s ease-in-out infinite alternate; }
  .ray-2 { left:51%; width:3px; background:linear-gradient(to bottom, transparent, rgba(255,235,150,.11), transparent); animation:rayFloat 15s ease-in-out infinite alternate-reverse; animation-delay:2s; }
  .ray-3 { left:63%; background:linear-gradient(to bottom, transparent, rgba(255,215,90,.06), transparent); animation:rayFloat 10s ease-in-out infinite alternate; animation-delay:4s; }
  @keyframes rayFloat {
    from { transform:rotate(-2deg) scaleY(.92); opacity:.5; }
    to   { transform:rotate(2deg) scaleY(1.08); opacity:1; }
  }
  .glow {
    position:fixed; top:15%; left:50%; transform:translateX(-50%);
    width:500px; height:400px;
    background:radial-gradient(ellipse, rgba(180,140,50,.07) 0%, transparent 65%);
    z-index:1; animation:glowBreathe 7s ease-in-out infinite alternate; pointer-events:none;
  }
  @keyframes glowBreathe {
    from { opacity:.4; transform:translateX(-50%) scale(.92); }
    to   { opacity:1; transform:translateX(-50%) scale(1.08); }
  }

  /* ── Sélecteur de langue ── */
  .lang-switch {
    position: fixed;
    top: 16px;
    right: 20px;
    z-index: 10;
    display: flex;
    gap: 0;
    background: rgba(0,0,0,.30);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 20px;
    overflow: hidden;
    backdrop-filter: blur(8px);
  }
  .lang-btn {
    padding: 5px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .10em;
    color: rgba(255,255,255,.50);
    background: transparent;
    border: none;
    cursor: pointer;
    transition: color .2s, background .2s;
  }
  .lang-btn.active {
    background: rgba(255,255,255,.15);
    color: #fff;
  }
  .lang-btn:hover:not(.active) { color:rgba(255,255,255,.80); }

  .stage {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1.5rem;
    width: 100%;
    max-width: 560px;
  }
  .logo-he {
    background: #fff;
    border-radius: 20px;
    width: 96px; height: 96px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 40px rgba(0,0,0,.45), 0 0 30px rgba(200,160,60,.12);
    margin-bottom: 1.4rem;
    animation: logoDescend 2.2s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes logoDescend {
    from { opacity:0; transform:translateY(-30px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .logo-he img { width:84px; height:84px; object-fit:contain; padding:4px; }
  .glass-card {
    width: 100%;
    background: rgba(8,18,8,.82);
    backdrop-filter: blur(22px) saturate(1.3);
    -webkit-backdrop-filter: blur(22px) saturate(1.3);
    border: 1px solid rgba(255,255,255,.13);
    border-top: 1px solid rgba(255,255,255,.22);
    border-radius: 22px;
    padding: 2.4rem 2.4rem 2rem;
    display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 8px 56px rgba(0,0,0,.50), inset 0 1px 0 rgba(255,255,255,.08);
    animation: cardReveal 2.8s cubic-bezier(.16,1,.3,1) both;
    animation-delay: .3s;
    position: relative;
  }
  @keyframes cardReveal {
    0%   { opacity:0; transform:translateY(40px) scale(.97); filter:blur(4px); }
    60%  { opacity:.8; filter:blur(0px); }
    100% { opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
  }
  .glass-card::before {
    content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:60%; height:1px;
    background:linear-gradient(to right, transparent, rgba(200,160,60,.35), transparent);
    animation:topGlow 4s ease-in-out infinite alternate;
  }
  @keyframes topGlow {
    from { opacity:.4; width:40%; }
    to   { opacity:1; width:70%; }
  }
  .brand-name {
    font-family:'Inter',sans-serif; font-size:clamp(36px,7vw,52px);
    font-weight:800; letter-spacing:.14em; color:#fff;
    text-align:center; line-height:1; margin-bottom:.45rem;
    animation:fadeUp 1s ease both; animation-delay:.8s;
  }
  .brand-name sup { font-size:.42em; vertical-align:super; font-weight:700; color:#fff; }
  .platform-sub {
    font-family:'Inter',sans-serif; font-size:clamp(10px,1.5vw,12px);
    font-weight:300; letter-spacing:.20em; color:rgba(255,255,255,.40);
    text-transform:uppercase; text-align:center; margin-bottom:1.8rem;
    animation:fadeUp 1s ease both; animation-delay:1s;
  }
  .sep  { width:36px; height:1px; background:rgba(232,160,32,.40); margin:0 auto 1.8rem; }
  .sep2 { width:36px; height:1px; background:rgba(232,160,32,.22); margin:0 auto 1.8rem; }
  .inscription {
    text-align:center; margin-bottom:2rem;
    animation:fadeUp 1.2s ease both; animation-delay:1.2s;
  }
  .inscription p { font-size:clamp(18px,2.6vw,22px); line-height:1.90; color:rgba(255,255,255,.94); }
  .inscription .kw { color:#E8A020; font-weight:500; }
  .btn-enter {
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; background:rgba(255,255,255,.93); color:#1A3D7A;
    font-family:'EB Garamond',Georgia,serif; font-size:clamp(17px,2.3vw,20px);
    font-weight:700; letter-spacing:.06em; padding:15px 24px; border-radius:10px; border:none;
    cursor:pointer; transition:background .2s, transform .18s, box-shadow .2s, color .2s;
    text-decoration:none; box-shadow:0 4px 20px rgba(0,0,0,.22);
    animation:fadeUp 1s ease both; animation-delay:1.6s;
    position:relative; overflow:hidden;
  }
  .btn-enter::before {
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(120deg, transparent 30%, rgba(26,61,122,.06) 50%, transparent 70%);
    transform:translateX(-100%);
    transition:transform .5s ease;
  }
  .btn-enter:hover { background:#fff; color:#0f2a5e; transform:translateY(-3px); box-shadow:0 12px 36px rgba(0,0,0,.32); }
  .btn-enter:hover::before { transform:translateX(100%); }
  .btn-enter:active { transform:translateY(-1px); box-shadow:0 4px 16px rgba(0,0,0,.20); }
  .btn-enter .arrow { color:#E8A020; font-size:20px; transition:transform .25s; font-weight:700; }
  .btn-enter:hover .arrow { transform:translateX(6px); }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(12px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .footer {
    margin-top:1.8rem; display:flex; flex-direction:column; align-items:center; gap:6px;
    animation:fadeUp 1s ease both; animation-delay:2s;
  }
  .footer-logo { width:64px; object-fit:contain; filter:brightness(0) invert(1); opacity:.38; }
  .footer-text { font-size:11px; letter-spacing:.12em; color:rgba(255,255,255,.26); font-family:'Inter',sans-serif; font-weight:300; text-align:center; }
  @media (max-width:480px) {
    .glass-card { padding:2rem 1.4rem 1.8rem; }
    .inscription p { font-size:16px; }
    .logo-he { width:82px; height:82px; }
    .logo-he img { width:70px; height:70px; }
    .lang-switch { top:12px; right:12px; }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="ray ray-1"></div>
<div class="ray ray-2"></div>
<div class="ray ray-3"></div>
<div class="glow"></div>

<!-- Sélecteur de langue -->
<div class="lang-switch">
  <button class="lang-btn active" onclick="setLang('fr')">FR</button>
  <button class="lang-btn" onclick="setLang('en')">EN</button>
</div>

  document.getElementById('t-line1').textContent = s.line1;
